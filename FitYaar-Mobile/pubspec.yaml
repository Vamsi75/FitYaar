name: fityaar
description: A new Flutter project for India-first fitness tracking.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  fl_chart: ^0.65.0
  intl: ^0.19.0
  google_fonts: ^6.1.0
  jwt_decoder: ^2.0.1
  flutter_svg: ^2.0.9
  path_drawing: ^1.0.1
  url_launcher: ^6.2.0
  flutter_local_notifications: ^22.3.0
  lottie: ^3.3.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/body/
    - assets/anim/
    - assets/brand/
    - assets/spot/
    - assets/equipment/

# App launcher icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#120E10"
  adaptive_icon_foreground: "assets/brand/app_icon.png"

# Splash shown while the app boots (run: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#120E10"
  image: assets/brand/primary_logo.png
  android: true
  ios: true
  android_12:
    # Android 12 masks the center image to a circle, so keep the compact icon here
    # (the full wordmark logo shows on the in-app BrandLoading screen instead).
    color: "#120E10"
    image: assets/brand/app_icon.png
