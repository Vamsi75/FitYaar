name: CI

on:
  push:
    # Feature/fix branches too, so they're checked before merging to master.
    branches: [ master, 'feat/**', 'fix/**' ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers uses the runner's Docker daemon (available on ubuntu-latest).
      - name: Build & test backend
        working-directory: FitYaar-Backend
        run: mvn -B verify

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version used for development, so new Flutter releases (e.g. 3.50
          # deprecating package:flutter/material.dart) can't break CI without a code change.
          # Bump this together with the local SDK.
          flutter-version: 3.47.5
      - name: Analyze mobile
        working-directory: FitYaar-Mobile
        run: |
          flutter pub get
          flutter analyze
