services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fityaar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./FitYaar-Backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/fityaar
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-me-in-prod-please-a-32char-minimum-secret
      SUPER_ADMIN_CODE: LETMEIN-SUPER
      # GOOGLE_CLIENT_ID: <your-google-oauth-client-id>
    ports:
      - "2098:8080"

volumes:
  pgdata:
